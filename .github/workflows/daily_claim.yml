name: Daily Claim Automation

on:
  schedule:
    # 18:05 UTC to ok. 20:05 czasu polskiego (czas letni)
    - cron: '5 18 * * *'
  workflow_dispatch: # ręczne uruchomienie

# Dodane uprawnienia dla wtyczki Keepalive
permissions:
  contents: write
  actions: write

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Pobranie kodu repozytorium
      uses: actions/checkout@v4

    - name: Konfiguracja środowiska Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalacja bibliotek
      run: |
        python -m pip install --upgrade pip
        pip install playwright requests
        playwright install chromium --with-deps

    - name: Uruchomienie skryptu
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}
      run: python main.py

    # zapobiegająca uśpieniu skryptu przez GitHuba po 60 dniach
    - name: Keepalive Workflow
      uses: gautamkrishnar/keepalive-workflow@v2